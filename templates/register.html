<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Study Buddy</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        background: #fff;
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
        width: 350px;
    }
    h1 { margin-bottom: 20px; color: #ff6b81; }
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid #ddd;
        box-sizing: border-box;
    }
    .button {
        width: 100%;
        padding: 12px;
        background-color: #ff6b81;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 12px;
        margin-top: 15px;
        cursor: pointer;
        transition: 0.3s;
    }
